# CodeQL code scanning (C/C++). Free for public repos.
#
# Manual build mode: the plugin builds against the Rack SDK, which autobuild
# can't guess — tools/get_sdk.sh fetches the lin-x64 SDK into ../Rack-SDK and
# the Makefile auto-detects it there. The Linux build compiles the vendored
# FAAD2/ogg/vorbis path (same code the VCV Library farm builds).
#
# src/dep/ (vendored dr_mp3, stb_vorbis, FAAD2, libogg, libvorbis) is excluded
# from alerts: we don't maintain that code, and upstream-tracking noise would
# drown the signal from src/ and src/net/ — the taint-tracking targets
# (Http/Stream/NjProtocol) are all first-party. For compiled languages the
# config's paths-ignore does NOT filter alerts (extraction follows the build),
# so the exclusion is applied to the SARIF before upload (filter-sarif step).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1' # weekly Mon 05:30 UTC: pick up new query packs

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF results
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Fetch Rack SDK
        run: tools/get_sdk.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          queries: security-and-quality

      - name: Build
        run: make -j"$(nproc)"

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
          output: sarif-results
          upload: failure-only

      - name: Filter vendored code out of results
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -src/dep/**
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif

      - name: Upload filtered results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/cpp.sarif
          category: "/language:c-cpp"
