<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="101.6mm" height="128.5mm" viewBox="0 0 101.6 128.5">
  <defs>
    <!-- Dark twin of Ninjam.svg: Fundamental's dark gradient with the same slight
         cool cast the light panel has vs Radio's neutral silver. -->
