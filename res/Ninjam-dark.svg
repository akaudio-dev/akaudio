      <stop offset="0" stop-color="#2a2b2c"/>
      <stop offset="1" stop-color="#171818"/>
    </linearGradient>
  </defs>
  <rect width="101.6" height="128.5" fill="url(#bg)"/>
  <rect width="101.6" height="14" fill="#333639"/>
</svg>
